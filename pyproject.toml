[project]
name = "f1-data-analysis"
version = "0.1.0"
description = "Interactive Formula 1 dashboard built with Streamlit — explore 75 seasons of race data (1950–2024) by driver, Grand Prix and circuit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
    "streamlit-echarts>=0.7.0",
]
